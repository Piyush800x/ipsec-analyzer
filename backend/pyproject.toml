[project]
name = "ipsec-analyzer"
version = "0.1.0"
description = "AI-powered IPsec VPN protocol analyzer and security assessment framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "uuid6>=2024.7.10",
    "dpkt>=1.9.8",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "polars>=1.44.1",
    "numpy>=2.4.6",
    "weasyprint>=69.0",
    # The portable PDF engine. WeasyPrint needs Pango/Cairo/GObject from the
    # system, which stock Windows never has; xhtml2pdf is pure Python over
    # reportlab, whose wheel also ships the font the reports use. So PDFs render
    # on any machine `uv sync` works on. See report/render.py.
    "xhtml2pdf>=0.2.20",
    "jinja2>=3.1.6",
    # Runtime, not training-only: inference loads the LightGBM traffic and mode
    # classifiers, so without this a plain `uv sync` gives a checkout whose
    # models silently fail to load and every Track B field falls back to
    # UNAVAILABLE. Found by cloning the repo clean and watching it happen.
    # A few megabytes; torch and scikit-learn stay in the `ml` group below.
    "lightgbm>=4.5",
    # Backs pydantic's EmailStr on the analyze request's optional notifyEmail.
    # Syntax only: pydantic never asks it for the DNS deliverability check.
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0.12.20260815",
    "httpx>=0.28.1",
    # A real SMTP server on loopback for the emailed-report tests (tests/_smtp.py).
    "aiosmtpd>=1.4",
    "pypdf>=6.19.0",
]
testbed = [
    "docker>=7.2.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]
# Training only. Deliberately not a runtime dependency: the API loads trained
# artefacts through analyzer.track_b.service, which needs neither LightGBM nor
# torch to read one, and putting a 200 MB tensor library in the offline image
# (step 11.4) to run inference it does not do would be a poor trade.
# Training only. Deliberately not runtime dependencies: torch is ~200 MB and
# the offline image (step 11.4) has no use for it, because inference loads the
# LightGBM classifier rather than the CNN. scikit-learn fits the isotonic
# calibration, which inference then applies through `np.interp` on the exported
# knots rather than by loading an estimator.
#
# SHAP values come from LightGBM's own `pred_contrib=True` (exact TreeSHAP)
# rather than the `shap` package, whose numba/llvmlite chain does not resolve
# against this project's numpy on Python 3.11. See track_b/attribution.py.
ml = [
    "scikit-learn>=1.5",
    "torch>=2.5",
]

[tool.ipsec-analyzer.external-tools]
# LLD §6.1: Wireshark's JSON field names change across releases and will silently
# break the Track A parser. The Dockerfile installs exactly this version and
# tests/test_tshark_version.py asserts the running binary matches.
tshark = "4.4.18"
# Testbed peer image (step 2.1). strongSwan decides the cryptography and
# tcpdump the capture, so both determine the packet geometry Track B learns
# from. A silent upgrade mid-dataset would split the corpus in two with
# nothing failing. testbed/Dockerfile.peer installs exactly these and
# tests/test_testbed_image.py asserts the built image matches.
strongswan = "5.9.8-5+deb12u5"
tcpdump_testbed = "4.99.3-1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming — enforces snake_case
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # comprehensions
    "DTZ",  # flake8-datetimez — bans naive datetimes
    "T20",  # no print()
    "PT",   # pytest style
    "RET",  # return simplification
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "ERA",  # commented-out code
    "RUF",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# testbed/image/ holds programs that run inside the peer container, not backend
# modules. They are standalone CLIs whose progress output on stderr is the point,
# and they are executed by the container Python, never imported by the backend.
"testbed/image/*" = ["T201"]
"alembic/versions/*" = ["E501", "N999"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
# `testbed` is a top-level package alongside `analyzer` rather than living under
# src/, so isort guesses it is third-party and sorts it above the imports it
# belongs beside.
known-first-party = ["analyzer", "testbed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src:."
packages = ["analyzer", "testbed"]
# testbed/image/ runs inside the peer container, against that container's
# interpreter and its dependencies (aiosmtpd), which are deliberately not
# backend dependencies. Type-checking them here would mean installing the
# container's requirements into the backend environment to satisfy a checker.
exclude = "^testbed/image/"

[[tool.mypy.overrides]]
module = ["uuid6.*", "docker.*", "dpkt.*", "weasyprint.*", "xhtml2pdf.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL server (set TEST_POSTGRES_URL)",
    "neon: requires a live Neon pooled endpoint (set NEON_POOLED_URL)",
    "docker: requires a running Docker daemon and the built peer image",
    "slow: takes minutes; opt in with TESTBED_SLOW=1",
]
