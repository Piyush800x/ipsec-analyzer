# Testbed charon configuration — implementation-plan step 2.1.
#
# Logging goes to stderr so that `docker logs` is the single place to look when
# a negotiation fails. The default journal logger writes into a systemd that is
# not running here, which loses the one message that would have explained the
# failure.

charon {
    filelog {
        stderr {
            default = 1
            ike = 2
            cfg = 2
            knl = 2
            time_format = %Y-%m-%d %H:%M:%S
            ike_name = yes
        }
    }

    # LLD §10.3. kernel-libipsec processes ESP in userspace, which would make
    # every container work and every capture a lie: Track B's entire feature set
    # is packet geometry, and userspace ESP does not reproduce the kernel's
    # padding, IV placement and MTU behaviour. The .so is deleted from the image
    # as well — this line exists so the intent is visible in config, not only in
    # a Dockerfile RUN step.
    plugins {
        kernel-libipsec {
            load = no
        }
    }

    # IKEv1 aggressive mode with a pre-shared key exposes the PSK hash to any
    # passive observer, so strongSwan refuses the combination unless told not to
    # -- the setting is named to make you think twice, and you should.
    #
    # It is enabled here because generating that exact weakness is the job of
    # this image. `ikev1-aggressive` is a dimension of the matrix (LLD 10.1),
    # the weak-reference tunnel of PRD 16 is built on it, and the finding
    # PROTO-AGGRESSIVE-MODE and ATT&CK T1110 are asserted against captures of
    # it. Without this line those cells of the matrix cannot be generated and
    # the demo has nothing to detect.
    #
    # This belongs to the testbed image and nowhere else. Nothing in this
    # repository configures a real tunnel, and if anything ever does, it must
    # not inherit this file.
    i_dont_care_about_security_and_use_aggressive_mode_psk = yes

    # Retransmission defaults are tuned for the internet. On a bridge network a
    # failed negotiation should fail in seconds, not in three minutes, so that
    # assert_sa_established (step 2.4) reports the real error rather than a
    # timeout that hides it.
    retransmit_timeout = 2.0
    retransmit_base = 1.4
    retransmit_tries = 3
}

# swanctl compiles in its own default plugin list, which names a dozen plugins
# Debian does not ship. Every swanctl invocation therefore prints a dozen load
# failures before doing its job, and the orchestrator has to parse that. Name
# exactly the plugins swanctl needs to read credentials and talk to vici.
swanctl {
    load = random nonce drbg sha1 sha2 md5 hmac gmp openssl pem pkcs1 pkcs8 pkcs12 x509 pubkey revocation constraints kdf mgf1
}
